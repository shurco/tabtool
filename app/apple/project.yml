name: TabTool

options:
  bundleIdPrefix: app.shurco
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  TabToolKit:
    path: TabToolKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  TabTool:
    type: application
    platform: macOS
    sources:
      - path: Shared
      - path: macOS
        excludes:
          - App/Info.plist
          - App/TabTool.entitlements
          - App/PrivacyInfo.xcprivacy
      - path: macOS/App/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: ../../LICENSE
        buildPhase: resources
    dependencies:
      - package: TabToolKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.shurco.tabtool
        PRODUCT_NAME: TabTool
        INFOPLIST_FILE: macOS/App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: macOS/App/TabTool.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "-"
      configs:
        Debug:
          ENABLE_TESTABILITY: YES

  TabToolTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TabToolTests
    dependencies:
      - target: TabTool
      - package: TabToolKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.shurco.tabtool.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"

  TabToolIOS:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: iOS
        excludes:
          - App/Info.plist
          - App/TabTool.entitlements
          - App/PrivacyInfo.xcprivacy
      - path: iOS/App/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: ../../LICENSE
        buildPhase: resources
    dependencies:
      - package: TabToolKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.shurco.tabtool
        PRODUCT_NAME: TabTool
        PRODUCT_MODULE_NAME: TabTool
        INFOPLIST_FILE: iOS/App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: iOS/App/TabTool.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "-"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
      configs:
        Debug:
          ENABLE_TESTABILITY: YES

  TabToolIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TabToolIOSTests
      - path: TabToolTests/CSVDocumentTests.swift
      - path: TabToolTests/CSVDocumentConcurrencyTests.swift
      - path: TabToolTests/CSVDocumentFormatTests.swift
      - path: TabToolTests/CSVDocumentMovingTests.swift
      - path: TabToolTests/CSVDocumentRenamingTests.swift
      - path: TabToolTests/CSVDocumentSortingTests.swift
      - path: TabToolTests/FormatChangePlannerTests.swift
      - path: TabToolTests/ExportPlanTests.swift
      - path: TabToolTests/PreferencesTests.swift
      - path: TabToolTests/LocalizationTests.swift
      - path: TabToolTests/AppLanguageTests.swift
      - path: TabToolTests/TestDefaults.swift
    dependencies:
      - target: TabToolIOS
      - package: TabToolKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.shurco.tabtool.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TabToolIOS
        CODE_SIGN_IDENTITY: "-"
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/TabTool.app/TabTool
        BUNDLE_LOADER: $(TEST_HOST)

  TabToolUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: TabToolUITests
    dependencies:
      - target: TabTool
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.shurco.tabtool.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TabTool
        CODE_SIGN_IDENTITY: "-"

schemes:
  TabTool:
    build:
      targets:
        TabTool: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      commandLineArguments:
        "-AppleLanguages (en)": true
      targets:
        - TabToolTests
        - TabToolUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  TabToolIOS:
    build:
      targets:
        TabToolIOS: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - TabToolIOSTests
