[package]
name = "tabtool-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Desktop services, settings and system locale for TabTool."

[dependencies]
directories = "6"
icu_decimal = { version = "2.4", features = ["alloc"] }
icu_locale_core = "2.4"
serde_json.workspace = true
tabtool-core = { path = "../tabtool-core" }
tabtool-i18n = { path = "../tabtool-i18n" }
tabtool-large = { path = "../tabtool-large" }
tabtool-settings = { path = "../tabtool-settings" }
tempfile = "3"

# Desktop-only services. Android replaces them with the JNI bridge.
[target.'cfg(not(target_os = "android"))'.dependencies]
open = "5"
rfd = { version = "0.18", default-features = false, features = ["xdg-portal"] }
sys-locale = "0.3"

# The Android bridge calls the Kotlin host through JNI.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
log = "0.4"
ndk-context = "0.1"
