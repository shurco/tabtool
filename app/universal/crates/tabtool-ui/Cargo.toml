[package]
name = "tabtool-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Design tokens, widgets and the deterministic egui test harness for TabTool."

[features]
default = []
# The kittest harness is only needed by tests.
test-support = ["dep:egui_kittest"]

[dependencies]
egui.workspace = true
tabtool-core = { path = "../tabtool-core" }
egui_kittest = { workspace = true, optional = true, default-features = false, features = [
    "snapshot",
    "wgpu",
] }

[dev-dependencies]
# Enables `test-support` for this package's own tests without enabling it for
# downstream consumers.
tabtool-ui = { path = ".", features = ["test-support"] }
tabtool-i18n = { path = "../tabtool-i18n" }
