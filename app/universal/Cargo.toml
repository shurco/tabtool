[workspace]
resolver = "3"
members = [
    "apps/tabtool-android",
    "apps/tabtool-desktop",
    "crates/tabtool-core",
    "crates/tabtool-document",
    "crates/tabtool-i18n",
    "crates/tabtool-large",
    "crates/tabtool-platform",
    "crates/tabtool-settings",
    "crates/tabtool-testdata",
    "crates/tabtool-ui",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[workspace.dependencies]
# TabTool installs the operating system's fonts; no font is bundled.
egui = { version = "=0.37.0" }
egui_kittest = "=0.37.0"
serde_json = "1"
