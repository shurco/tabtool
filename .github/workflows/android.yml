name: Android

# Packaging for the Android app: both ABIs, the debug APK on every run, and
# the signed release APK/AAB only when the signing secrets exist. No emulator:
# the APK is inspected with aapt2 instead (docs/android.md). Called by
# universal.yml on every change and by release.yml for tags and manual builds.
on:
  workflow_call:
    inputs:
      require-signing:
        description: Fail when the release signing secrets are missing.
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: app/universal

jobs:
  android:
    runs-on: ubuntu-22.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.2.13676358
      TABTOOL_ANDROID_KEYSTORE_BASE64: ${{ secrets.TABTOOL_ANDROID_KEYSTORE_BASE64 }}
      TABTOOL_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.TABTOOL_ANDROID_KEYSTORE_PASSWORD }}
      TABTOOL_ANDROID_KEY_ALIAS: ${{ secrets.TABTOOL_ANDROID_KEY_ALIAS }}
      TABTOOL_ANDROID_KEY_PASSWORD: ${{ secrets.TABTOOL_ANDROID_KEY_PASSWORD }}
      REQUIRE_SIGNING: ${{ inputs.require-signing }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            app/universal/target
          key: ${{ runner.os }}-android-cargo-1.99.1-${{ hashFiles('app/universal/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-android-cargo-1.99.1-
      - name: Install the NDK
        run: |
          if [ ! -d "$ANDROID_NDK_HOME" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" >/dev/null
          fi
      - name: Install cargo-ndk
        run: |
          if ! cargo ndk --version 2>/dev/null | grep -q "cargo-ndk 4.1.2"; then
            cargo install cargo-ndk --version 4.1.2 --locked
          fi
      - name: Check the release signing secrets
        run: |
          if [ -z "$TABTOOL_ANDROID_KEYSTORE_BASE64" ]; then
            if [ "$REQUIRE_SIGNING" = "true" ]; then
              echo "This build must be signed, but TABTOOL_ANDROID_KEYSTORE_BASE64 is not set." >&2
              exit 1
            fi
            echo "No release signing secrets: the release build is skipped." >&2
            exit 0
          fi
          for name in TABTOOL_ANDROID_KEYSTORE_PASSWORD TABTOOL_ANDROID_KEY_ALIAS TABTOOL_ANDROID_KEY_PASSWORD; do
            if [ -z "$(printenv "$name")" ]; then
              echo "TABTOOL_ANDROID_KEYSTORE_BASE64 is set but $name is empty." >&2
              echo "Set all four signing secrets, or none to skip the release build." >&2
              exit 1
            fi
          done
      - name: Build the native libraries
        working-directory: app/universal/apps/tabtool-android/android
        run: |
          rm -rf app/src/main/jniLibs
          cargo ndk -t arm64-v8a -t x86_64 -o app/src/main/jniLibs build -p tabtool-android
      - name: Build the debug APK
        working-directory: app/universal/apps/tabtool-android/android
        run: ./gradlew --no-daemon assembleDebug
      - name: Verify the debug APK
        working-directory: .
        run: scripts/android-verify app/universal/apps/tabtool-android/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: tabtool-android-debug
          path: app/universal/apps/tabtool-android/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Decode the release keystore
        if: ${{ env.TABTOOL_ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          printf '%s' "$TABTOOL_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "TABTOOL_ANDROID_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Build the release APK and AAB
        if: ${{ env.TABTOOL_ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: app/universal/apps/tabtool-android/android
        run: |
          rm -rf app/src/main/jniLibs
          cargo ndk -t arm64-v8a -t x86_64 -o app/src/main/jniLibs build --release -p tabtool-android
          ./gradlew --no-daemon assembleRelease bundleRelease
      - name: Verify the release artifacts
        if: ${{ env.TABTOOL_ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: .
        run: |
          scripts/android-verify --release app/universal/apps/tabtool-android/android/app/build/outputs/apk/release/app-release.apk
          unzip -l app/universal/apps/tabtool-android/android/app/build/outputs/bundle/release/app-release.aab \
            | grep -q base/lib/arm64-v8a/libmain.so
          unzip -l app/universal/apps/tabtool-android/android/app/build/outputs/bundle/release/app-release.aab \
            | grep -q base/lib/x86_64/libmain.so
      - name: Upload the release artifacts
        if: ${{ env.TABTOOL_ANDROID_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: tabtool-android-release
          path: |
            app/universal/apps/tabtool-android/android/app/build/outputs/apk/release/app-release.apk
            app/universal/apps/tabtool-android/android/app/build/outputs/bundle/release/app-release.aab
